name: Weekly sandbox contract
# Runs the payment adapter contract suite against the real sandbox of every adapter marked `verified` in the registry
# (task 9.4). Sandbox credentials come only from repository secrets; none are in the repository. Test mode only: the
# suite refuses anything that is not a test credential. A failed job is the alert: no email or message is sent.
on:
  schedule:
    - cron: "23 19 * * 0" # Sundays 19:23 UTC (Monday morning in Brisbane)
  workflow_dispatch:

concurrency:
  group: weekly-sandbox-contract
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      keys: ${{ steps.plan.outputs.keys }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build the shared package (the adapters import both)
        run: pnpm --filter @mt/api exec prisma generate && pnpm --filter @mt/shared build
      - name: List verified adapters from the registry
        id: plan
        env:
          APP_ENV: ci
        run: |
          set -euo pipefail
          json=$(pnpm --silent --filter @mt/api exec tsx scripts/weekly-sandbox-plan.ts)
          keys=$(echo "$json" | jq -c '.keys')
          count=$(echo "$keys" | jq 'length')
          echo "keys=$keys" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" = "0" ]; then
            {
              echo "## Weekly sandbox contract"
              echo
              echo "**0 verified adapters, nothing to test.** Every registered adapter is still \`experimental\`, so no sandbox run was attempted. This is not a pass for any gateway."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Weekly sandbox contract"
              echo
              echo "$count verified adapter(s) to test: $(echo "$keys" | jq -r 'join(", ")')"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  sandbox:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        adapter: ${{ fromJSON(needs.plan.outputs.keys) }}
    env:
      APP_ENV: ci
      SANDBOX_ADAPTER: ${{ matrix.adapter }}
      # Repository secrets, empty when unset (the suite then fails its credential check before any network call).
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_WEBHOOK_SECRET }}
      PAYPAL_SANDBOX_CLIENT_ID: ${{ secrets.PAYPAL_SANDBOX_CLIENT_ID }}
      PAYPAL_SANDBOX_CLIENT_SECRET: ${{ secrets.PAYPAL_SANDBOX_CLIENT_SECRET }}
      PAYPAL_SANDBOX_WEBHOOK_ID: ${{ secrets.PAYPAL_SANDBOX_WEBHOOK_ID }}
      PAYPAL_SANDBOX_BUYER_EMAIL: ${{ secrets.PAYPAL_SANDBOX_BUYER_EMAIL }}
      PAYPAL_SANDBOX_BUYER_PASSWORD: ${{ secrets.PAYPAL_SANDBOX_BUYER_PASSWORD }}
      PIN_TEST_SECRET_KEY: ${{ secrets.PIN_TEST_SECRET_KEY }}
      PIN_TEST_PUBLISHABLE_KEY: ${{ secrets.PIN_TEST_PUBLISHABLE_KEY }}
      PIN_TEST_WEBHOOK_KEY: ${{ secrets.PIN_TEST_WEBHOOK_KEY }}
      PIN_TEST_CARD_PAY: ${{ secrets.PIN_TEST_CARD_PAY }}
      PIN_TEST_CARD_DECLINE: ${{ secrets.PIN_TEST_CARD_DECLINE }}
      EWAY_SANDBOX_API_KEY: ${{ secrets.EWAY_SANDBOX_API_KEY }}
      EWAY_SANDBOX_API_PASSWORD: ${{ secrets.EWAY_SANDBOX_API_PASSWORD }}
      EWAY_SANDBOX_PUBLIC_KEY: ${{ secrets.EWAY_SANDBOX_PUBLIC_KEY }}
      # File inputs arrive as base64 secrets and are written outside the repository below.
      B64_PAYPAL_SANDBOX_RECORDED_DELIVERY: ${{ secrets.PAYPAL_SANDBOX_RECORDED_DELIVERY_B64 }}
      B64_PIN_TEST_RECORDED_DELIVERY: ${{ secrets.PIN_TEST_RECORDED_DELIVERY_B64 }}
      B64_PIN_TEST_ACS_SCRIPT: ${{ secrets.PIN_TEST_ACS_SCRIPT_B64 }}
      B64_EWAY_SANDBOX_BROWSER_SCRIPT: ${{ secrets.EWAY_SANDBOX_BROWSER_SCRIPT_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client and build the shared package (the adapters import both)
        run: pnpm --filter @mt/api exec prisma generate && pnpm --filter @mt/shared build
      - name: Write file inputs from secrets
        run: |
          set -euo pipefail
          for name in PAYPAL_SANDBOX_RECORDED_DELIVERY PIN_TEST_RECORDED_DELIVERY PIN_TEST_ACS_SCRIPT EWAY_SANDBOX_BROWSER_SCRIPT; do
            var="B64_$name"
            if [ -n "${!var:-}" ]; then
              printf '%s' "${!var}" | base64 -d > "$RUNNER_TEMP/$name"
              echo "$name=$RUNNER_TEMP/$name" >> "$GITHUB_ENV"
            fi
          done
      - name: Contract suite against the ${{ matrix.adapter }} sandbox
        run: pnpm --filter @mt/api test:sandbox
      - name: Summary
        if: always()
        run: echo "Sandbox contract for \`${{ matrix.adapter }}\`: job status ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
