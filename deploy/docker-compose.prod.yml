# Production stack for a single server (docs/deploy/guide.md). Not run by CI or by any task: Oscar runs it.
# Usage, from the repository root:
#   docker compose --env-file deploy/production.env -f deploy/docker-compose.prod.yml up -d --build
# Only Caddy publishes ports (80 and 443). The database, the API and the web app are on the private network, so
# nobody can reach the API directly and forge X-Forwarded-For (docs/done/0.3.md).
name: marathon-trips-prod
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in deploy/production.env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ../deploy/db-init-prod.sql:/db-init-prod.sql:ro
      - ../docker/db/init/01-roles.sql:/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: { context: .., dockerfile: docker/Dockerfile, target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://mt_app:${MT_APP_PASSWORD:?}@db:5432/marathon_trips
      MIGRATION_DATABASE_URL: postgresql://mt_owner:${MT_OWNER_PASSWORD:?}@db:5432/marathon_trips
      WEB_ORIGIN: ${WEB_ORIGIN:?set the public https:// address}
      # The web container is the only proxy in front of the API (private network address).
      TRUST_PROXY: uniquelocal
      COOKIE_SECURE: "true"
      EMAIL_HASH_KEY: ${EMAIL_HASH_KEY:?}
      FILE_SIGNING_KEY: ${FILE_SIGNING_KEY:?}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?}
      AUTH_HMAC_KEY: ${AUTH_HMAC_KEY:?}
      MAIL_MODE: ${MAIL_MODE:-catch}
      MAIL_FROM: ${MAIL_FROM:-Marathon Trips <no-reply@example.test>}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      FILE_STORAGE_DIR: /data/files
    volumes:
      - filedata:/data/files
    # No "ports": the API is never published.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_BASE_URL: http://api:4000
      # Caddy is one proxy in front of the web app and sets X-Forwarded-For to the client address: one hop.
      WEB_TRUSTED_PROXY_HOPS: "1"
    # No "ports": only Caddy reaches the web app.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      web: { condition: service_healthy }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set the domain name, without https://}
    ports: ["80:80", "443:443"]
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

volumes:
  dbdata:
  filedata:
  caddydata:
  caddyconfig:
